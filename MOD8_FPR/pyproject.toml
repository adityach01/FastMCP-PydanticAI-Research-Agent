[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmcp-pydanticai-research-agent"
version = "0.1.0"
description = "Production-ready FastMCP x PydanticAI research agent"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Student" }]
dependencies = [
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "pydantic-ai-slim>=0.0.16",
  "fastapi>=0.112.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
packages = ["student"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
